# cargo-deny configuration. Run: cargo deny check
[graph]
targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "aarch64-apple-darwin"]

[licenses]
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
